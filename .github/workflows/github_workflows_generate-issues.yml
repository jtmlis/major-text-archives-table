name: Generate World Archives Issues

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  generate-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate issues
        run: |
          python3 scripts/generate-world-issues.py \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --countries data/countries.csv \
            --divisions data/list-of-countries-and-their-administrative-divisions.csv

      - name: Create summary
        if: always()
        run: |
          echo "## 🌍 World Archives Issues Generated" >> $GITHUB_STEP_SUMMARY
          echo "Batch job completed. Check the Actions logs for details." >> $GITHUB_STEP_SUMMARY
